[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/backend-signal",
    "bin/chat-isomorphic",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
