[package]
name = "chat-isomorphic"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
signal = ["dep:chat-isomorphic-backend-signal"]

[dependencies]
chat-isomorphic-core = { path = "../../crates/core" }
chat-isomorphic-backend-signal = { path = "../../crates/backend-signal", optional = true }
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
